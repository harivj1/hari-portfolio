    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
